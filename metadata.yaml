name: astrbot_plugin_obsidian_sync
display_name: Obsidian 第二大脑
short_desc: 手机电脑自动同步 Obsidian，AI 帮你搜索、整理并记住每一篇笔记。
desc: |-
  把 Obsidian 接进 AstrBot：内置 WebDAV 供 Remotely Save 双向同步；同时为 LLM 提供
  搜索、读取、写入、浏览、软删除笔记的原生工具，让 Bot 拥有可检索的长期知识库。

  v1.3.3：移除默认用户名 neko，留空或旧默认值会生成 vault_xxxxxxxx。

  v1.3.2：作者改为 maolbsMd（plugin_id 变更），功能不变。

  v1.3.1：市场展示名改为「Obsidian 第二大脑」，功能与 1.3.0 一致。

  v1.3.0：软删除与回收站（/obsidian rm、trash、restore），delete 工具默认关闭。

  v1.2.0：SQLite FTS5 全文索引（中文 trigram）、历史版本与 /obsidian undo、
  doctor 自检与工具调用审计。

  v1.1.0 安全基线：默认只监听 127.0.0.1、弱口令自动替换为随机强口令、
  路径校验防越界、禁止 WebDAV 写入 .obsidian/plugins 与 .git、
  写入前自动备份。
version: 1.3.3
author: maolbsMd
repo: https://github.com/maolbsMd/astrbot_plugin_obsidian_sync
icon: logo.png
support_platforms:
